name: Fetch HymecNG File and Generate Webp

on:
  workflow_dispatch:

concurrency:
  # verhindert, dass zwei Laeufe gleichzeitig dieselbe Datei generieren/hochladen
  group: fetch-hymecng
  cancel-in-progress: false

jobs:
  fetch_generate_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Sicherheitsnetz, falls die Datei nie erscheint

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.HG_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set RUN and DATE (rounded to 5 min, UTC)
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          MINUTE_RAW=$(date -u +%M)
          MINUTE=$(( (10#$MINUTE_RAW / 5) * 5 ))
          TIME=$(printf "%02d%02d" "$HOUR" "$MINUTE")
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          DATE=$(date -u +%Y%m%d)

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "run=${DATE}_${TIME}" >> $GITHUB_OUTPUT

      - name: Download HymecNG composite file from DWD Open Data (mit Retry)
        run: |
          mkdir -p data/hymecng

          FILENAME="composite_HymecNG_${DATE}_${TIME}_000-hd5"
          URL="https://opendata.dwd.de/weather/radar/composite/hymecng/${FILENAME}"
          OUT="data/hymecng/${FILENAME}"

          # Die Datei erscheint normalerweise ~1 Min nach dem 5-Minuten-Slot,
          # in Ausnahmefaellen bis zu ~2 Min spaeter. Wir pollen alle 15s,
          # bis zu 10 Versuche = max. 2,5 Minuten Wartezeit.
          MAX_ATTEMPTS=50
          SLEEP_SECONDS=5

          echo "Warte auf: $URL"
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            HTTP_CODE=$(curl -s -o "$OUT" -w "%{http_code}" \
              --connect-timeout 10 --max-time 60 \
              "$URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ] && [ -s "$OUT" ]; then
              echo "Datei erfolgreich geladen (Versuch $i/$MAX_ATTEMPTS, HTTP $HTTP_CODE)."
              exit 0
            fi

            echo "Versuch $i/$MAX_ATTEMPTS: Datei noch nicht verfuegbar (HTTP $HTTP_CODE). Warte ${SLEEP_SECONDS}s..."
            rm -f "$OUT"
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Datei nach $MAX_ATTEMPTS Versuchen (~$(( MAX_ATTEMPTS * SLEEP_SECONDS / 60 )) Minuten) nicht verfuegbar - Abbruch."
          exit 1

      - name: Generate WEBP for HymecNG
        run: python scripts/generate_webp.py

      - name: Upload gewitter_latest.webp to R2 (mit Retry)
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if aws s3 cp ./data/hymecng/gewitter_latest.webp \
                s3://${{ secrets.R2_BUCKET }}/hymecng/gewitter_latest.webp \
                --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com; then
              echo "Upload erfolgreich (Versuch $i/$MAX_ATTEMPTS)."
              exit 0
            fi
            echo "Upload fehlgeschlagen (Versuch $i/$MAX_ATTEMPTS), warte 10s..."
            sleep 10
          done
          echo "::error::Upload nach $MAX_ATTEMPTS Versuchen fehlgeschlagen."
          exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
